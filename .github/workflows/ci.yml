name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      # Package.swift takes swift-testing from the Command Line Tools, so the compiler must come from there too.
      - name: Select the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
